<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amark Project — Gantt Chart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#e2e8f0;font-family:'SF Mono','Fira Code','Cascadia Code',monospace;padding:40px 32px}
h1{font-size:22px;font-weight:600;margin-bottom:4px;letter-spacing:-.3px;color:#f1f5f9}
.sub{color:#64748b;font-size:13px;margin-bottom:32px}
.legend{display:flex;gap:20px;margin-bottom:28px;font-size:12px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;color:#94a3b8}
.legend-swatch{width:14px;height:14px;border-radius:4px}
.gantt{position:relative;border-top:1px solid #1e293b;padding-top:0}
.row{display:flex;align-items:center;min-height:36px;border-bottom:1px solid #1a1f2e;position:relative}
.row.milestone{min-height:42px;background:#131826;border-bottom:1px solid #1e3a5f;font-weight:600;color:#60a5fa;font-size:13px;letter-spacing:.3px}
.row.milestone .label{padding-left:8px}
.row.spacer{min-height:12px;border-bottom:none;background:transparent}
.label{width:320px;flex-shrink:0;font-size:11px;padding:4px 8px 4px 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cbd5e1;line-height:1.4}
.label .sub-text{display:block;font-size:10px;color:#64748b;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label .ref{color:#475569;font-size:9px}
.track{flex:1;position:relative;height:36px;display:flex;align-items:center}
.bar{position:absolute;height:22px;border-radius:4px;cursor:pointer;transition:opacity .15s,box-shadow .15s;min-width:4px}
.bar:hover{opacity:.9;box-shadow:0 0 0 1px rgba(255,255,255,.15);z-index:10}
.bar.done{background:#22c55e;opacity:.75}
.bar.in-progress{background:linear-gradient(90deg,#3b82f6,#2563eb)}
.bar.open{background:linear-gradient(90deg,#f59e0b,#d97706)}
.bar.target{background:linear-gradient(90deg,#10b981,#059669);box-shadow:0 0 8px rgba(16,185,129,.3)}
.bar.planned{background:#6b7280;opacity:.7}
.bar.future{background:#374151;opacity:.4}
.bar-date{position:absolute;font-size:9px;color:#64748b;white-space:nowrap;pointer-events:none;line-height:22px;padding-left:6px;font-weight:450}
.bar-date.done{color:#4ade80}
.bar-date.in-progress{color:#93c5fd}
.bar-date.open{color:#fbbf24}
.time-labels{display:flex;margin-bottom:6px;margin-left:320px;position:relative;height:20px}
.time-label{position:absolute;font-size:9px;color:#475569;transform:translateX(-50%);white-space:nowrap}
.time-tick{position:absolute;top:0;width:1px;height:8px;background:#1e293b}
.time-tick.major{height:14px;background:#2d3a50}
.tooltip{position:fixed;display:none;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:10px 14px;font-size:12px;line-height:1.6;max-width:420px;z-index:1000;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tooltip .tt-title{font-weight:600;color:#f1f5f9;margin-bottom:2px}
.tooltip .tt-meta{color:#94a3b8;font-size:11px}
.tooltip .tt-refs{color:#60a5fa;font-size:10px;margin-top:4px}
.tooltip .tt-sub{color:#64748b;font-size:10px;margin-top:2px;border-top:1px solid #2d3a50;padding-top:4px;max-height:100px;overflow-y:auto}
.footer{margin-top:32px;font-size:11px;color:#475569;border-top:1px solid #1e293b;padding-top:16px}
.footer a{color:#60a5fa;text-decoration:none}
</style>
</head>
<body>

<h1>📊 Amark Project — Gantt Chart</h1>
<p class="sub">Milestone-based delivery roadmap · Jun – Dec 2026 · <span id="today"></span></p>

<div class="legend">
  <span class="legend-item"><span class="legend-swatch" style="background:#22c55e"></span> Done</span>
  <span class="legend-item"><span class="legend-swatch" style="background:#3b82f6"></span> In Progress</span>
  <span class="legend-item"><span class="legend-swatch" style="background:#f59e0b"></span> Open</span>
  <span class="legend-item"><span class="legend-swatch" style="background:#6b7280"></span> Planned</span>
  <span class="legend-item"><span class="legend-swatch" style="background:#374151"></span> Future</span>
  <span style="flex:1"></span>
  <span class="legend-item" style="color:#475569">hover bars for details</span>
</div>

<div class="gantt" id="gantt">
  <!-- Time axis rendered by JS -->
  <div class="time-labels" id="timeAxis"></div>
  <!-- Rows rendered by JS -->
  <div id="rows"></div>
</div>

<div class="tooltip" id="tooltip"></div>

<div class="footer">
  <a href="https://docs.google.com/spreadsheets/d/1qogHAflMkh1o1UIJpuMFxqixst7RXERhd8dbcdmcNjE" target="_blank">Google Sheet</a>
  · <a href="https://github.com/fachry-isl/amark" target="_blank">GitHub</a>
  · Regenerate when TIMELINE changes

<script>

  { m:null, title:"UI/UX for Non-Technical Users",                status:"📋 Open", start:"2026-08-10", end:"2026-08-11", bar:"open",
    sub:"Onboarding wizard · Task templates (Sales/CS/HR) · Usability testing",

  { m:null, title:"Security Hardening",                           status:"📋 Open", start:"2026-08-14", end:"2026-08-17", bar:"open",
    sub:"Auth audit · Input validation · Rate limiting · SSL, backup, monitoring",
    refs:"New issues TBD" },
  { m:null, title:"Production Checklist",                         status:"📋 Open", start:"2026-08-18", end:"2026-08-22", bar:"open",
    sub:"Worker scaling · Concurrency analysis · Racing condition · Deployment runbook",

  { m:null, title:"SaaS Development (Phase 3): Billing, public sign-up, multi-org", status:"⏳ TBD", start:"2027-01-01", end:"2027-06-30", bar:"future",

    refs:"No issues assigned" },

// ── Date helpers ────────────────────────────────────────────────
const DAY_MS = 86400000;
const MIN_DATE = new Date("2026-06-01");
const MAX_DATE = new Date("2027-06-30");
const RANGE_DAYS = (MAX_DATE - MIN_DATE) / DAY_MS;

function dateToOffset(d) {
  return (d - MIN_DATE) / DAY_MS;
}

// ── Render ──────────────────────────────────────────────────────
function render() {
  const todayEl = document.getElementById('today');
  const now = new Date();
  todayEl.textContent = now.toISOString().split('T')[0];

  // Time axis - month markers
  const axis = document.getElementById('timeAxis');
  const months = ['Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan 2027','Feb','Mar','Apr','May','Jun'];
  const monthStarts = [
    "2026-06-01","2026-07-01","2026-08-01","2026-09-01","2026-10-01","2026-11-01","2026-12-01",
    "2027-01-01","2027-02-01","2027-03-01","2027-04-01","2027-05-01","2027-06-01"
  ];
  monthStarts.forEach((d,i)=>{
    const dt = new Date(d);
    const offset = dateToOffset(dt);
    const pct = (offset / RANGE_DAYS) * 100;
    const div = document.createElement('div');
    div.className = 'time-label';
    div.style.left = pct + '%';
    div.textContent = months[i];
    axis.appendChild(div);
  });

  // Rows
  const container = document.getElementById('rows');

  ITEMS.forEach((item, i) => {
    if (item.spacer) {
      const sp = document.createElement('div');
      sp.className = 'row spacer';
      container.appendChild(sp);
      return;
    }

    const row = document.createElement('div');
    row.className = 'row';

    // Label
    const label = document.createElement('div');
    label.className = 'label';
    if (item.m) {
      // Milestone header
      row.classList.add('milestone');
      label.innerHTML = `<span style="font-size:13px">${item.m}</span>`;
      label.style.paddingLeft = '8px';
    } else {
      // Regular item
      let labelText = item.title;
      let subText = '';
      if (item.refs && item.refs !== 'No issues assigned' && item.refs !== 'New issues TBD') {
        subText = `<span class="ref">${item.refs}</span>`;
      }
      label.innerHTML = `${labelText}${subText ? ' <span class="sub-text">' + subText + '</span>' : ''}`;
    }
    row.appendChild(label);

    // Track with bar
    const track = document.createElement('div');
    track.className = 'track';
    row.appendChild(track);

    container.appendChild(row);

    // ── Render bar ──
    if (item.start && item.end) {
      const startD = new Date(item.start);
      const endD = new Date(item.end);
      // Clamp to view range
      const sOff = Math.max(0, dateToOffset(startD));
      const eOff = Math.min(RANGE_DAYS, dateToOffset(endD) + 1);
      const leftPct = (sOff / RANGE_DAYS) * 100;
      const widthPct = Math.max(0.3, ((eOff - sOff) / RANGE_DAYS) * 100);

      const bar = document.createElement('div');
      bar.className = `bar ${item.bar || 'planned'}`;
      bar.style.left = leftPct + '%';
      bar.style.width = widthPct + '%';
      bar.dataset.idx = i;
      bar.addEventListener('mouseenter', showTooltip);
      bar.addEventListener('mousemove', moveTooltip);
      bar.addEventListener('mouseleave', hideTooltip);
      track.appendChild(bar);

      // ── Date label at bar's right edge ──
      const dateLabel = document.createElement('span');
      dateLabel.className = `bar-date ${item.bar || 'planned'}`;
      dateLabel.style.left = `calc(${leftPct + widthPct}% + 2px)`;

      // Format date label: "15 Jun" / "Jun 11–25" / "Jul–Aug" / "Jun 11–Jul 31"
      const monthNames = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const sMon = startD.getMonth() + 1, eMon = endD.getMonth() + 1;
      const sDay = startD.getDate(), eDay = endD.getDate();
      const lastDayOfMonth = new Date(endD.getFullYear(), endD.getMonth() + 1, 0).getDate();

      if (sDay === eDay && sMon === eMon) {
        dateLabel.textContent = `${sDay} ${monthNames[sMon]}`;
      } else if (sMon === eMon) {
        dateLabel.textContent = `${monthNames[sMon]} ${sDay}–${eDay}`;
      } else if (sDay === 1 && eDay === lastDayOfMonth && eMon === sMon + 1) {
        // Full consecutive months: "Jul–Aug"
        dateLabel.textContent = `${monthNames[sMon]}–${monthNames[eMon]}`;
      } else {
        dateLabel.textContent = `${monthNames[sMon]} ${sDay}–${monthNames[eMon]} ${eDay}`;
      }
      track.appendChild(dateLabel);
    }
  });
}

// ── Tooltip ─────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');

function showTooltip(e) {
  const idx = parseInt(e.target.dataset.idx);
  const item = ITEMS[idx];
  if (!item || item.spacer || !item.title) return;

  let html = `<div class="tt-title">${item.title}</div>`;
  html += `<div class="tt-meta">${item.status} · ${item.start || '?'} → ${item.end || '?'}</div>`;
  if (item.sub && item.sub.trim()) {
    html += `<div class="tt-sub">${item.sub}</div>`;
  }
  if (item.refs && item.refs.trim()) {
    // Make issue/PR refs clickable
    let refText = item.refs;
    refText = refText.replace(/#(\d+)/g, '<a href="https://github.com/fachry-isl/amark/issues/$1" target="_blank" style="color:#60a5fa;text-decoration:underline">#$1</a>');
    refText = refText.replace(/PR #(\d+)/g, '<a href="https://github.com/fachry-isl/amark/pull/$1" target="_blank" style="color:#60a5fa;text-decoration:underline">PR #$1</a>');
    html += `<div class="tt-refs">${refText}</div>`;
  }
  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
}

function moveTooltip(e) {
  const x = e.clientX + 16;
  const y = e.clientY + 12;
  // Prevent overflow
  const rect = tooltip.getBoundingClientRect();
  const maxX = window.innerWidth - rect.width - 10;
  const maxY = window.innerHeight - rect.height - 10;
  tooltip.style.left = Math.min(x, maxX) + 'px';
  tooltip.style.top = Math.min(y, maxY) + 'px';
}

function hideTooltip() {
  tooltip.style.display = 'none';
}

// ── Init ────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
